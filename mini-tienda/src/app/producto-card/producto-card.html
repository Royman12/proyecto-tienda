<div class="tarjeta">
  <img [src]="producto().imagen" [alt]="producto().nombre" class="img-producto">
  <h3>{{ producto().nombre }}</h3>
  <p>Precio: ${{ producto().precio }}</p>

  @if (producto().stock > 0) {
    <p class="disponible">Stock: {{ producto().stock }}</p>
    <!-- FUNCIONALIDAD B: aviso cuando el stock llega al mínimo -->
    @if (producto().stock <= producto().stockMinimo) {
      <p class="stock-bajo">¡Stock bajo!</p>
    }
  } @else {
    <p class="agotado">Agotado</p>
  }

  <button (click)="alHacerClic()" [disabled]="producto().stock === 0">
    Comprar
  </button>

  <!-- Acciones de administración -->
  <div class="acciones-admin">
    <!-- FUNCIONALIDAD B: campo numérico + botón Reponer (reemplaza al botón +5 stock) -->
    <input type="number" name="cantidad" [(ngModel)]="cantidad" class="input-cantidad">
    <button class="btn-secundario" (click)="alReponer()">Reponer</button>
    <button class="btn-peligro" (click)="eliminar.emit(producto().id)">Eliminar</button>
  </div>
</div>
