# Nombre de la aplicación y puerto del servidor
spring.application.name=tienda-api
server.port=8080

# Conexión a H2 en modo ARCHIVO: los datos se guardan en la carpeta data/
# del proyecto y sobreviven cuando se apaga el servidor
spring.datasource.url=jdbc:h2:file:./data/tiendadb
spring.datasource.username=sa
spring.datasource.password=

# JPA crea y actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update

# Muestra en la terminal el SQL que JPA ejecuta (útil para aprender)
spring.jpa.show-sql=true

# Consola web para ver la base de datos desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console